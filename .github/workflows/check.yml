name: Проверки
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    # Trusted actors use the shared self-hosted runner; Dependabot and forks use
    # GitHub-hosted runners so auto-merge cannot stall on it.
    runs-on: ${{ (github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","mt-container"]') || 'ubuntu-latest' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Установить Gitleaks из официального выпуска
        shell: bash
        run: |
          case "$(uname -m)" in
            x86_64) multitracker_arch=x64 multitracker_sha=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb ;;
            aarch64 | arm64) multitracker_arch=arm64 multitracker_sha=e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080 ;;
            *) echo "Неизвестная архитектура: $(uname -m)" >&2; exit 1 ;;
          esac
          multitracker_archive="gitleaks_8.30.1_linux_${multitracker_arch}.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$multitracker_archive" \
            --output "$RUNNER_TEMP/$multitracker_archive"
          cd "$RUNNER_TEMP"
          echo "$multitracker_sha  $multitracker_archive" | sha256sum --check
          tar --extract --gzip --file "$multitracker_archive" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm run check
      - name: Установить agent-browser и выбрать системный Chrome или Chromium
        shell: bash
        run: |
          npm install --global agent-browser@0.38.1
          multitracker_chrome_path="$(command -v google-chrome || command -v chromium)"
          "$multitracker_chrome_path" --version
          printf 'AGENT_BROWSER_EXECUTABLE_PATH=%s\n' "$multitracker_chrome_path" >> "$GITHUB_ENV"
      - name: Проверить действия интерфейса
        shell: bash
        env:
          MULTITRACKER_UI_URL: http://127.0.0.1:5173
          MULTITRACKER_SMOKE_OUTPUT: ${{ runner.temp }}/ui-smoke
        run: |
          ./node_modules/.bin/vite --host 127.0.0.1 --port 5173 --strictPort \
            > "$RUNNER_TEMP/vite.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 30 --retry-delay 1 \
            --retry-connrefused --retry-all-errors --retry-max-time 40 \
            --connect-timeout 2 --max-time 2 "$MULTITRACKER_UI_URL" > /dev/null
          npm run test:ui 2>&1 | tee "$RUNNER_TEMP/ui.log"
          npm run test:smoke 2>&1 | tee "$RUNNER_TEMP/smoke.log"
      - name: Строгая матрица 135×8
        shell: bash
        env:
          MULTITRACKER_MATRIX_OUT: ${{ runner.temp }}/matrix
        run: |
          ./node_modules/.bin/vite --host 127.0.0.1 --port 5174 --strictPort \
            > "$RUNNER_TEMP/vite-matrix.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 30 --retry-delay 1 \
            --retry-connrefused --retry-all-errors --retry-max-time 40 \
            --connect-timeout 2 --max-time 2 http://127.0.0.1:5174/ > /dev/null
          MULTITRACKER_UI_URL=http://127.0.0.1:5174 \
            node --experimental-strip-types scripts/exhaust/matrix.ts 2>&1 | tee "$RUNNER_TEMP/matrix.log"
      - name: Перебор покрытия и реестры
        shell: bash
        run: |
          ./node_modules/.bin/vite build --outDir dist/exhaust --emptyOutDir --sourcemap
          node <<'SERVER' &
          import http from 'node:http';
          import { readFile } from 'node:fs/promises';
          import { extname, resolve } from 'node:path';
          const root = resolve('dist/exhaust');
          const types = { '.html': 'text/html; charset=utf-8', '.js': 'text/javascript; charset=utf-8', '.css': 'text/css; charset=utf-8', '.svg': 'image/svg+xml', '.png': 'image/png', '.woff2': 'font/woff2', '.json': 'application/json', '.txt': 'text/plain; charset=utf-8', '.webmanifest': 'application/manifest+json' };
          http.createServer(async (req, res) => {
            const p = new URL(req.url, 'http://x').pathname;
            const f = resolve(root, '.' + (p === '/' ? '/index.html' : p));
            if (!f.startsWith(root + '/')) return res.writeHead(403).end();
            try { const d = await readFile(f); res.writeHead(200, { 'Content-Type': types[extname(f)] ?? 'application/octet-stream', 'Cache-Control': 'no-store' }); res.end(d); } catch { res.writeHead(404).end(); }
          }).listen(5179, '127.0.0.1');
          SERVER
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 30 --retry-delay 1 \
            --retry-connrefused --retry-all-errors --retry-max-time 40 \
            --connect-timeout 2 --max-time 2 http://127.0.0.1:5179/ > /dev/null
          MULTITRACKER_UI_URL=http://127.0.0.1:5179 \
            node --experimental-strip-types scripts/exhaust/run.ts 2>&1 | tee "$RUNNER_TEMP/exhaust.log"
      - name: Сохранить доказательства матрицы и перебора
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: matrix-evidence
          path: |
            ${{ runner.temp }}/matrix.log
            ${{ runner.temp }}/matrix
            ${{ runner.temp }}/exhaust.log
            docs/audits/*-exhaust
      - name: Сохранить доказательства проверок интерфейса
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-evidence
          path: |
            ${{ runner.temp }}/vite.log
            ${{ runner.temp }}/ui.log
            ${{ runner.temp }}/smoke.log
            ${{ runner.temp }}/ui-smoke
