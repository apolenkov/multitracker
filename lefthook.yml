# Installed by the lefthook package on `npm ci`; skip once with LEFTHOOK=0, reinstall with `npx lefthook install`.
pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: "*.{ts,tsx,css}"
      run: npx prettier --check {staged_files}
    - name: lint
      glob: "*.{ts,tsx}"
      run: npm run -s lint
    - name: typecheck
      glob: "*.{ts,tsx}"
      run: npm run -s typecheck
commit-msg:
  jobs:
    - name: commitlint
      run: npx commitlint --edit {1}
pre-push:
  jobs:
    - name: check
      run: npm run -s check
