schema: spec-driven
context: |
  Продукт: MultiTracker — приватный трекер инвестиционных портфелей. Текущий этап — полный статический интерактивный макет; production roadmap — будущая работа.
  Стек текущего этапа: React, TypeScript, Vite, npm. Исходные финансовые примеры неизменяемы; demo-поля могут временно меняться только в открытой форме и не сохраняются/не передаются. Файлы и секреты не принимаются; нет сети, базы, сервера, шифрования и долговременного хранения.
  Требования OpenSpec описывают наблюдаемое поведение и используют сценарии Given/When/Then. Решения реализации находятся в design.md и tasks.md.
  Quality gates с первого TypeScript кода: strict, noUncheckedIndexedAccess, exactOptionalPropertyTypes; когнитивная сложность <=10; файл исходного кода <=300 строк; функция <=50 строк; без let и мутаций; доступный интерфейс; статический анализ безопасности; аудит зависимостей; секретов нет.
rules:
  specs:
    - Описывать наблюдаемое пользовательское поведение сценариями Given/When/Then.
    - Честно описывать ограничения макета; не обещать безопасность или сохранение данных.
    - Указывать поведение на мобильном экране и с клавиатуры.
  design:
    - Макет остаётся клиентским и с малым числом зависимостей.
    - Будущие службы не подключаются; финансовые fixtures неизменяемы, временные поля форм сбрасываются при закрытии, а file/API-secret примеры доступны только для чтения.
  tasks:
    - Включать точные команды проверок и наблюдаемые критерии прохождения.
